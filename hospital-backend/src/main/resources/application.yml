server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: hospital-backend

  datasource:
    url: jdbc:mysql://localhost:3306/hospitaldb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: sumit

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 86400000

# WhatsApp Cloud API (Meta) - OPD booking via WhatsApp.
# Leave 'enabled: false' to run the bot in demo/log-only mode with no real
